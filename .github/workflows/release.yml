name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --target x86_64-unknown-linux-musl

      - run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BIN="zhist-${VERSION}-linux-x64-musl"
          strip target/x86_64-unknown-linux-musl/release/zhist
          mv target/x86_64-unknown-linux-musl/release/zhist "target/x86_64-unknown-linux-musl/release/${BIN}"
          echo "BIN=${BIN}" >>"${GITHUB_ENV}"

      - uses: softprops/action-gh-release@v3
        with:
          files: target/x86_64-unknown-linux-musl/release/${{ env.BIN }}
