name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo install cross --locked

      - run: cross build --release --target ${{ matrix.target }}

      - run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          ARCH="${{ matrix.target == 'x86_64-unknown-linux-musl' && 'x64' || 'arm64' }}"
          BIN="zhist-${VERSION}-linux-${ARCH}-musl"
          strip "target/${{ matrix.target }}/release/zhist" || true
          mv "target/${{ matrix.target }}/release/zhist" "target/${{ matrix.target }}/release/${BIN}"
          echo "BIN=${BIN}" >>"${GITHUB_ENV}"

      - uses: softprops/action-gh-release@v3
        with:
          files: target/${{ matrix.target }}/release/${{ env.BIN }}
